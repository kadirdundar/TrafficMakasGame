<!doctype html>
<html>
<body style="margin:0;background:#222">
<!-- Cockpit preview from the driver seat: /tools/model-preview/cockpit.html?car=bmw&preset=0..2&night=1&w=720&h=1280
     ext=x,y,z&look=x,y,z  free debug camera | hl=<mesh name part>  paint matching meshes magenta
     pick=px,py;px,py  report which meshes the screen pixels hit (and whether front or back faces) -->
<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const car = q.get('car') || 'bmw';
const W = +(q.get('w')||1280), H = +(q.get('h')||720);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.35;
document.body.appendChild(r.domElement);
const night = q.get('night')==='1';
const scene = new THREE.Scene(); scene.background = new THREE.Color(night ? 0x0a1020 : 0x6a8fbf);
const ec = document.createElement('canvas'); ec.width=512; ec.height=256; const g=ec.getContext('2d');
const gr=g.createLinearGradient(0,0,0,256); [[0,'#1e3a5f'],[0.45,'#6488b8'],[0.5,'#cbd5e1'],[0.55,'#1e293b'],[1,'#0f172a']].forEach(([a,b])=>gr.addColorStop(a,b));
g.fillStyle=gr; g.fillRect(0,0,512,256); g.fillStyle='#fff'; for(let i=0;i<8;i++) g.fillRect(30+i*60,85,28,10);
const et=new THREE.CanvasTexture(ec); et.mapping=THREE.EquirectangularReflectionMapping; et.colorSpace=THREE.SRGBColorSpace;
scene.environment=et; scene.environmentIntensity=0.85;
const sun = new THREE.DirectionalLight(0xfff2e0, night?0.2:2.0); sun.position.set(-5,10,-8); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x404040, night?0.25:0.8));
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(16,400).rotateX(-Math.PI/2).translate(0,0,-200), new THREE.MeshStandardMaterial({color:0x3a3d42, roughness:0.9})));
for (let z=-5; z>-200; z-=12) for (const x of [-3.6,0,3.6]) scene.add(new THREE.Mesh(new THREE.PlaneGeometry(0.15,4).rotateX(-Math.PI/2).translate(x,0.01,z), new THREE.MeshBasicMaterial({color:0xffffff})));
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(800,800).rotateX(-Math.PI/2).translate(0,-0.02,0), new THREE.MeshStandardMaterial({color:0x4d6b3a})));
const rt = new THREE.WebGLRenderTarget(256,128);
const presets = [[0,1.25,0.2,58,0.24],[0,1.28,0.35,62,0.30],[0,1.22,0.05,54,0.18]];
const P = presets[+(q.get('preset')||0)];
const eye = new THREE.Vector3(P[0],P[1],P[2]);
const { loadCockpit3D } = await import('/src/cockpit3d.js');
const { CarCockpit } = await import('/src/cockpit.js');
const painter = Object.create(CarCockpit.prototype); painter.carType = car; painter.ambientKey = 'cyan';
painter._screenState = { speedKmh: 128, rpm: 4300, gear: 6, highBeam: false, odometerKm: 1428.4 };
const ck = await loadCockpit3D({ carType: car, eyeAnchor: new THREE.Vector3(...presets[0].slice(0,3)), mirrorTexture: rt.texture, paintScreen: (n,ctx,w,h)=>painter.paint3DScreen(n,ctx,w,h) });
scene.add(ck.group);
const cam = new THREE.PerspectiveCamera(P[3], W/H, 0.05, 1000);
cam.position.copy(eye);
if (q.get('ext')) { const [x,y,z]=q.get('ext').split(',').map(Number); cam.position.set(x,y,z); const [a,b,c]=(q.get('look')||'0,1.1,-0.5').split(',').map(Number); cam.lookAt(a,b,c); }
else cam.setViewOffset(W,H,0,Math.round(H*P[4]),W,H);
cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
ck.update({ steerAngle: +(q.get('steer')||0), night, aspect: W/H });
if (q.get('hl')) { ck.group.traverse(o => { if (o.isMesh && o.name.toLowerCase().includes(q.get('hl').toLowerCase())) o.material = new THREE.MeshBasicMaterial({color:0xff00ff, side:THREE.DoubleSide}); }); }
r.render(scene, cam);
const info = {};
if (q.get('pick')) { const rc = new THREE.Raycaster(); ck.group.updateMatrixWorld(true);
  for (const p of q.get('pick').split(';')) { const [px,py]=p.split(',').map(Number); rc.setFromCamera(new THREE.Vector2(px/W*2-1, -(py/H)*2+1), cam);
    const hits = rc.intersectObject(ck.group, true).filter(h=>h.object.visible).slice(0,3);
    info[p] = hits.map(h => { const n = h.face.normal.clone().transformDirection(h.object.matrixWorld); return `${h.object.name} [${h.object.material.name}] d=${h.distance.toFixed(2)} facing=${(n.dot(rc.ray.direction)<0)?'front':'BACK'} side=${h.object.material.side}`; }); } }
window.__info = info; window.__done = true;
</script>
</body>
</html>
