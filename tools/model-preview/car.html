<!doctype html>
<html>
<body style="margin:0;background:#222">
<!-- Exterior preview (car = id or alias from src/cars/): /tools/model-preview/car.html?car=m4&az=-2.3&pol=1.3&dist=9.5&night=1&brake=1 -->
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const car = q.get('car') || 'bmw';
const W = +(q.get('w') || 900), H = +(q.get('h') || 600);
const night = q.get('night') === '1';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H);
r.toneMapping = THREE.ACESFilmicToneMapping;
r.toneMappingExposure = 1.2;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x05070a : 0x30343a);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = night ? 0.15 : 1;
const sun = new THREE.DirectionalLight(0xffffff, night ? 0.1 : 1.5);
sun.position.set(3, 6, -2);
scene.add(sun, new THREE.HemisphereLight(0xcfe0ff, 0x202020, 0.4));
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 })));
const { loadCarExterior } = await import('/src/cars/index.js');
const c = await loadCarExterior(car, { paintHex: Number(q.get('paint') || 0x0e6f9c) });
scene.add(c.group);
c.setLights({ night, braking: q.get('brake') === '1', highBeam: q.get('high') === '1' });
if (q.get('spoiler')) c.setSpoiler(q.get('spoiler')); // lip | ducktail | wing
if (q.get('rim')) c.setRimColor(Number(q.get('rim'))); // e.g. 0xc9a227
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 35), W / H, 0.05, 100);
const az = +(q.get('az') || -2.3), pol = +(q.get('pol') || 1.3), dist = +(q.get('dist') || 9.5);
const tgt = new THREE.Vector3(...(q.get('t') || '0,0.65,0').split(',').map(Number));
cam.position.set(tgt.x + dist * Math.sin(pol) * Math.sin(az), tgt.y + dist * Math.cos(pol), tgt.z + dist * Math.sin(pol) * Math.cos(az));
cam.lookAt(tgt);
const box = new THREE.Box3().setFromObject(c.group);
window.__info = { box: [box.min.toArray(), box.max.toArray()] };
window.__scene = scene;
window.__cam = cam;
window.__c = c;
window.__done = true;

function animate() {
  requestAnimationFrame(animate);
  r.render(scene, cam);
}
animate();
</script>
</body>
</html>
